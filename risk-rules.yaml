# risk-rules.yaml — EXAMPLE ruleset (not loaded unless you ask for it)
#
# Why this file exists
# --------------------
# Intake decides how risky a task is by looking for words in its description.
# Which words matter belongs to the system being dispatched for — its private
# file names, its stores, its subsystems — not to the engine. Those literals
# are therefore supplied by the deployment and never committed here.
#
# The engine ships with generic built-in defaults and an EMPTY external
# ruleset. Nothing below is active until a deployment points at a file:
#
#     export ORCH_RISK_RULES=~/.config/agent-orch/risk-rules.yaml
#
# This file is a worked example of the format. Copy it, then replace the rules
# with your own vocabulary.
#
# Failure behaviour (implemented in orchestrator/risk_rules.py):
#   * unset            -> empty ruleset, silent
#   * set but missing  -> empty ruleset + warning on stderr
#   * malformed        -> refuses to start; a half-parsed risk file would make
#                         the operator believe gating was on while it was not
#
# External rules can only raise an assessment, never lower one: the built-in
# defaults still apply and this file is unioned with them.
#
# Format note: rules are a mapping keyed by rule id rather than a sequence.
# The engine has exactly one YAML subset parser and it is mapping-only;
# introducing a second parser to gain list syntax would be a worse trade than
# keying by id, and the id has to be unique anyway.
#
# Entry schema:
#   keyword   the literal or pattern to look for (defaults to the rule id)
#   category  high_risk | medium_risk | stop_gate | target_hint
#   action    mark_high_risk | mark_medium_risk | require_stop_gate
#             | require_human_ack | hint_target
#   match     substring (default) | word | regex
#   target    only meaningful with action hint_target
#   note      one line of rationale

version: 1

defaults:
  # Applied when nothing matches. Keep it conservative: a deployment that
  # ships no rules should not gain a false sense of gating.
  risk: low
  require_stop_gate: false

rules:
  # --- irreversible outward effects ------------------------------------
  publish:
    keyword: publish
    category: stop_gate
    action: require_stop_gate
    match: word
    note: the result leaves the machine and cannot be recalled

  deploy:
    keyword: deploy
    category: stop_gate
    action: require_stop_gate
    match: word
    note: changes what is running for someone other than the operator

  delete:
    keyword: delete
    category: stop_gate
    action: require_stop_gate
    match: word
    note: destructive and usually irreversible

  # --- persistent state -------------------------------------------------
  schema_migration:
    keyword: migration
    category: high_risk
    action: mark_high_risk
    match: word
    note: schema and data shape changes are hard to roll back

  credential_handling:
    keyword: credential
    category: high_risk
    action: require_human_ack
    note: anything touching secrets needs an explicit human acknowledgement

  # --- control plane of the orchestrator itself -------------------------
  scheduler:
    keyword: scheduler
    category: high_risk
    action: mark_high_risk
    match: word
    note: a broken scheduler silently stops all later work

  daemon_control:
    keyword: daemon
    category: high_risk
    action: mark_high_risk
    match: word

  # --- softer signals ---------------------------------------------------
  notification:
    keyword: notification
    category: medium_risk
    action: mark_medium_risk

  public_api_rename:
    keyword: '(?:refactor|rename)\\s+public\\s+api'
    category: medium_risk
    action: mark_medium_risk
    match: regex

  # --- target hints -----------------------------------------------------
  # Used to guess which component a task is about when the caller did not say.
  provider_hint:
    keyword: provider
    category: target_hint
    action: hint_target
    target: provider-adapter
    match: word

  intake_hint:
    keyword: intake
    category: target_hint
    action: hint_target
    target: intake
    match: word

# Deployment-specific rules — private file names, private subsystem names,
# personal knowledge-base paths, local database file names — belong in the
# deployment's own copy of this file and are intentionally absent here.
