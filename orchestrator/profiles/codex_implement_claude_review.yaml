version: 1
type: apply
initial_stage: implement
max_transitions: 6
stages:
  implement:
    owner: codex
    attempt_cap: 2
    timeout: 900
    prompt: "You are implementing a change. All paths below are relative to your working directory, which is the task workspace; work there unless the task input names another worktree. Read the task input and its embedded routing decision first. Preserve unrelated user changes. Do not commit, push, reset, clean, run a stop gate, or make provider network calls beyond this provider process. If the tasks declare Blocked by, work only the dependency frontier and recompute it after each verified task; if no task declares dependencies, keep the given order; if the metadata is partial or cyclic, stop rather than guess. Run focused local tests that need no provider network access. Keep completed local evidence distinct from evidence that still requires a production-shaped run, such as daemon restart, state recovery, lease and lock behaviour, provider routing, notification delivery, or a stop gate. Write reports/implement-report.md covering files changed, behaviour, tests, deviations, risks, and remaining evidence. When complete, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: implemented"
    outcomes:
      implemented: review
  review:
    owner: claude
    attempt_cap: 2
    timeout: 900
    prompt: "You are reviewing an implementation produced by a different provider family. All paths below are relative to your working directory, which is the task workspace. Read the task input, the routing decision, the diff, and reports/implement-report.md. Preserve unrelated user changes. Do not commit, push, reset, clean, run a stop gate, or make provider network calls beyond this provider process. Review and report three axes separately: Product/Spec alignment, Platform constraints, and Verification evidence. A passing axis cannot mask a failed or unowned unknown one, and local or mocked checks cannot stand in for the production-shaped evidence the risk demands. Verification evidence alone may be marked DEFERRED, and only when the report names the remaining check and its next owner or gate. Write reports/implement-review.md with an explicit verdict per axis; High and Medium findings are the only blocking repair scope. If Product/Spec alignment and Platform constraints PASS, Verification evidence is PASS or an owned DEFERRED, and no High or Medium blocking finding remains, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: ready. Otherwise print exactly one typed outcome: ORCHESTRATOR_OUTCOME: needs_repair"
    outcomes:
      ready: done
      needs_repair: repair
  repair:
    owner: codex
    attempt_cap: 2
    timeout: 900
    prompt: "You are doing delta repair on your own implementation. All paths below are relative to your working directory, which is the task workspace. Read reports/implement-review.md and repair only the High and Medium findings. Preserve unrelated user changes. Do not commit, push, reset, clean, run a stop gate, or make provider network calls beyond this provider process. Run focused local tests that need no provider network access. Update reports/implement-report.md with the delta: files changed, tests, deviations, risks. When complete, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: repaired"
    outcomes:
      repaired: delta_review
  delta_review:
    owner: claude
    attempt_cap: 2
    timeout: 900
    prompt: "You are reviewing a delta repair. All paths below are relative to your working directory, which is the task workspace. Read the task input, the current diff, reports/implement-report.md, and reports/implement-review.md. Preserve unrelated user changes. Do not commit, push, reset, clean, run a stop gate, or make provider network calls beyond this provider process. Update reports/implement-review.md with delta-only findings and re-evaluate every Product/Spec alignment, Platform constraints, and Verification evidence axis that previously failed, was unknown, or was deferred. Verification evidence may stay DEFERRED only with an explicit remaining check and a named next owner or gate. If Product/Spec alignment and Platform constraints PASS, Verification evidence is PASS or an owned DEFERRED, and no High or Medium blocking finding remains, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: ready. Otherwise print exactly one typed outcome: ORCHESTRATOR_OUTCOME: needs_repair"
    outcomes:
      ready: done
      needs_repair: repair
  done:
    terminal: done
edge_caps:
  implement.implemented: 1
  review.ready: 1
  review.needs_repair: 1
  repair.repaired: 2
  delta_review.ready: 1
  delta_review.needs_repair: 1
