version: 1
type: propose
initial_stage: draft
max_transitions: 14
stages:
  draft:
    owner: claude
    attempt_cap: 2
    timeout: 600
    prompt: "You are drafting a specification. The brief is in the task input above. All paths below are relative to your working directory, which is the task workspace. First read review-notes.md if it exists. Address every finding in its Blocking findings section, one by one; items under Resolved this round and Advisory do not block you. If decision-answer.md exists in the task artifact directory, treat its contents as a decision the user has already settled and apply it exactly; do not rewrite it, do not supply any decision it does not contain, and never create that file yourself. Then write your complete spec to spec-draft.md, replacing any previous version. Stay inside the brief. Look up facts you can verify yourself from the repository, existing specs, or runtime evidence; never promote your own suggestion or inference into a user decision. Prefer deleting, reusing, or observing something that already exists over adding a new actor, state, artifact, protocol, probe, counter, scheduler, daemon, or recovery branch. For each mechanism you do add, be able to say which specific and unacceptable failure it prevents, where that failure is sourced from, which acceptance item cannot be proven without it, why nothing existing achieves the same effect, and why it is not more complex than the risk it controls. If an open question would change scope, architecture, persistent state, routing, or how the work gets verified, first check whether a design exists that removes the question entirely; if one does, adopt it. Only if every design satisfying the brief must still answer the question, record that single highest-priority question with your recommended answer and its trade-off in a clearly titled section of spec-draft.md, and let review block on it. If the spec contains implementation tasks, give each one an explicit Blocked by (write none when it has no dependency) and observable completion evidence; mark a task parallel-safe only when it shares no dependency, no mutable state, no overlapping files, and no contract risk with another task. When the draft is complete, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: drafted"
    outcomes:
      drafted: review
  simplify:
    owner: claude
    attempt_cap: 2
    timeout: 600
    prompt: "You are simplifying a specification that has grown mechanisms which contradict each other. All paths below are relative to your working directory, which is the task workspace. Read review-notes.md and spec-draft.md, and work only from the current Blocking findings. Your job is not to patch contradictions with more machinery; remove what caused them whenever the immutable brief still remains satisfied. You may delete a mechanism, merge mechanisms, restructure using something that already exists, or remove only a requirement invented by the current draft and not traceable to the immutable task input, a settled user decision, established policy, or sourced runtime evidence. You must never remove, weaken, defer, reinterpret, or relabel a requirement or acceptance outcome traceable to one of those sources, even when doing so would eliminate the contradiction. Adding machinery remains forbidden by default. There is exactly one exception: when a current Blocking finding gives a resolvable source reference, a concrete failure scenario, and a named acceptance target, and no delete, merge, or reuse design can preserve the sourced requirement, you may add exactly one smallest necessary mechanism for that finding. State why existing primitives are insufficient and exclude every adjacent capability; this necessity repair is not permission to expand for completeness. If preserving the sourced requirement instead requires a material user choice about scope, architecture, persistent state, routing, rollback, or verification, leave that finding unresolved so review can route needs_user_decision rather than inventing the choice. If decision-answer.md exists in the task artifact directory, treat its contents as a decision the user has already settled and apply it exactly; never create that file yourself. Use the current spec-draft.md as the base. Make the smallest coherent edit that resolves the current Blocking findings: change only the affected mechanisms and necessary cross-references, and leave unrelated sections, evidence, decisions, tasks, and wording unchanged. Do not rewrite the whole document, restate background, reorder unaffected material, or expand it for completeness. The result must not grow unless preserving a sourced original risk, applying an original_surface or regression correction, or adding the single smallest necessary mechanism allowed above requires it; name every necessary addition in the simplification delta. Keep one concise Simplification delta table with one row per current blocking finding and the columns finding/reference, action (delete/merge/reuse/remove-draft-only-requirement/necessary-minimal-mechanism), and existing carrier of the affected sourced risk. Do not copy all historical risks into the table; point to their existing spec sections. Every current original_surface or regression correction, and every sourced original risk affected by an edit, must remain traceable. Simplification may delete mechanisms; it may never silently drop or weaken a sourced risk or requirement. When the edit is complete, print exactly one typed outcome: ORCHESTRATOR_OUTCOME: simplified"
    outcomes:
      simplified: review
  review:
    owner: codex
    attempt_cap: 2
    timeout: 600
    prompt: "You are reviewing a specification. All paths below are relative to your working directory, which is the task workspace. Read spec-draft.md and check it against the brief in the task input above for High-severity gaps or contradictions. Judge three axes separately: Product/Spec alignment, Platform constraints, and Verification evidence; at this stage judge whether the evidence plan is sufficient, not whether unexecuted checks passed. A FAIL or UNKNOWN on any axis cannot be masked by a PASS on another. If the spec contains tasks, check that Blocked by is complete and acyclic, that parallel-safe claims hold, and that completion evidence is proportional to the risk. Overwrite review-notes.md with exactly three sections: Blocking findings, Resolved this round, and Advisory. Keep only findings that are still live this round; a finding whose mechanism was deleted goes under Resolved this round with the note resolved_by mechanism_deleted. Do not carry stable finding ids or accumulated history. Every blocking finding must carry these fields: Source, one of user_requirement or runtime_evidence or established_invariant; Source reference, a resolvable file, artifact, or policy reference; Failure scenario, a concrete counterexample; Material consequence; Why spec must decide now; Simplest sufficient correction; and Finding origin, one of original_surface or newly_added_spec_mechanism or regression. A finding with no resolvable Source reference is advisory, not blocking. A generic demand to rewrite the whole document is not a legal blocking finding. Do not invent a blocking invariant on the spot. Classify each blocking finding by origin: original_surface means the risk is in the surface being specified; newly_added_spec_mechanism means the contradiction exists only because this spec added the mechanism; regression means simplification or a previous round dropped a risk that had been covered. Then choose the outcome in this order. One: if any blocking finding has origin newly_added_spec_mechanism, the outcome is needs_simplification, even when corrections are outstanding in the same round; keep all of those corrections in the Blocking findings section so simplification cannot lose them. Two: otherwise, if any blocking finding has origin original_surface or regression, the outcome is needs_correction. Three: otherwise, if a decision is missing that would change scope, architecture, persistent state, routing, rollback, or how the work is verified, the outcome is needs_user_decision. This applies only when every design satisfying the brief must answer that decision; if a design exists that removes the decision and still passes the burden of proof, require that design under rule one or two instead of holding. Four: otherwise the outcome is ready, which additionally requires that every original major risk has a minimally sufficient treatment pointing at a specific section, that every retained mechanism can justify itself, that every unexecuted check sits in a Deferred evidence section with a risk, an observation target, and a named owner or gate, that no scope, persistent state, routing, rollback, or verification decision remains undecided, and that no axis is FAIL or UNKNOWN. Print exactly one typed outcome, one of: ORCHESTRATOR_OUTCOME: ready, ORCHESTRATOR_OUTCOME: needs_correction, ORCHESTRATOR_OUTCOME: needs_simplification, or ORCHESTRATOR_OUTCOME: needs_user_decision"
    outcomes:
      ready: done
      needs_correction: draft
      needs_simplification: simplify
      needs_user_decision: draft
  done:
    terminal: done
edge_caps:
  draft.drafted: 5
  simplify.simplified: 2
  review.ready: 1
  review.needs_correction: 2
  review.needs_simplification: 2
  review.needs_user_decision: 1
